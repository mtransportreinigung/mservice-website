<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>app-service-m - Mejstrik Transport &amp; Reinigung Service</title>

<link rel="apple-touch-icon" href="logo.PNG">
<link rel="icon" href="logo.PNG" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M Service">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#1E3A6D;--b:#2D6CB5;--br:#1F4EA8;--o:#F57C00;--l:#F4F7FB;--bd:#D6DFEA;--g:#666;--ok:#1F7A44;--bad:#C0392B}
html{background:#eef1f5}
body{font:13.5px/1.4 Arial,Helvetica,sans-serif;color:#2a2a2a;padding-bottom:calc(75px + env(safe-area-inset-bottom))}

/* PIN-SCHUTZ */
#pin-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--n);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
#pin-screen img.logo-pin{width:70px;height:70px;margin-bottom:12px;border-radius:10px;object-fit:contain;background:#fff}
#pin-screen h2{font-size:17px;margin-bottom:4px;color:#fff}
#pin-screen p{font-size:11.5px;color:#a0b8e6;margin-bottom:15px}
.pin-input{font-size:22px;letter-spacing:8px;text-align:center;width:150px;padding:8px;border-radius:6px;border:2px solid var(--o);outline:0;color:var(--n);margin-bottom:12px;background:#fff}
.pin-btn{font:bold 14px Arial;background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer;width:150px}
.pin-err{color:#ff8a8a;font-size:11.5px;margin-top:8px;display:none;font-weight:bold}

/* FIXIERTE UND SCHLANKE HEADER-LEISTE */
.app-header{background:var(--n);color:#fff;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:900;box-shadow:0 1px 4px rgba(0,0,0,0.2);height:50px}
.app-header .hdr-brand{display:flex;align-items:center;gap:8px}
.app-header img.hdr-logo{width:26px;height:26px;border-radius:4px;object-fit:cover;background:#fff}
.app-header h1{font-size:14px;font-weight:bold}
.app-header span{font-size:9.5px;color:#a0b8e6}

.container{padding:10px;max-width:800px;margin:60px auto 10px auto}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.05);border-top:3px solid var(--o)}
.card h2{font-size:14px;color:var(--n);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}

.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:11px;font-weight:bold;color:var(--n);margin-bottom:2px}
input,select,textarea{font:13.5px Arial;color:#0A2A8A;border:1px solid var(--bd);background:#fff;width:100%;padding:7px;border-radius:5px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--b);background:rgba(45,108,181,0.03)}
.btn{font:bold 12.5px Arial;border:0;background:var(--b);color:#fff;border-radius:5px;padding:9px 12px;cursor:pointer;width:100%;text-align:center;display:block}
.btn:active{opacity:0.8}
.btn-sec{background:#fff;color:var(--n);border:1px solid var(--bd);margin-top:5px}
.btn-ok{background:var(--ok)}
.btn-back{background:var(--g);margin-bottom:8px}

/* STABILE FIXIERTE NAVIGATION UNTEN (OHNE HOCHSPRINGEN) */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:950;box-shadow:0 -2px 8px rgba(0,0,0,0.06)}
.bottom-nav button{background:0;border:0;font-size:9.5px;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;flex:1;outline:0}
.bottom-nav button svg{width:18px;height:18px;fill:var(--g)}
.bottom-nav button.active{color:var(--br);font-weight:bold}
.bottom-nav button.active svg{fill:var(--br)}

.view{display:none}
.view.active{display:block}

.doc-container{width:100%;height:600px;border:1px solid var(--bd);border-radius:6px;background:#fff;margin-top:6px}

.photo-preview{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.photo-preview img{width:50px;height:50px;object-fit:cover;border-radius:4px;border:1px solid var(--bd)}
</style>
</head>
<body>

<div id="pin-screen">
  <img src="logo.PNG" alt="Logo" class="logo-pin" onerror="this.style.display='none'">
  <h2>M Transport &amp; Reinigung</h2>
  <p>Sicherheitssystem - PIN eingeben</p>
  <input type="password" id="pin-val" class="pin-input" maxlength="4" pattern="\d*" inputmode="numeric" placeholder="••••">
  <button class="pin-btn" onclick="checkPin()">Anmelden</button>
  <div id="pin-err" class="pin-err">Falscher PIN-Code!</div>
</div>

<header class="app-header">
  <div class="hdr-brand">
    <img src="logo.PNG" alt="Logo" class="hdr-logo" onerror="this.style.display='none'">
    <div>
      <h1>M Transport &amp; Reinigung</h1>
      <span>Mobile Zentrale (app-service-m)</span>
    </div>
  </div>
  <div>
    <button onclick="lockApp()" style="background:rgba(255,255,255,0.15);border:0;color:#fff;padding:5px 8px;border-radius:4px;font-size:10.5px;cursor:pointer">🔒 Sperren</button>
  </div>
</header>

<div class="container">

  <!-- TAB 1: BUCHHALTUNG & SCHNELL-ERFASSUNG -->
  <div id="v-buchhaltung" class="view active">
    <div class="card" style="border-top-color:var(--br)">
      <h2>Buchhaltung &amp; Jahr-Auswahl</h2>
      <div class="form-group">
        <label>Buchhaltungs-Jahr:</label>
        <input id="m-year" type="number" value="2027" min="2000" max="2099" oninput="changeYear(this.value)">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
        <button class="btn" onclick="openFullBuchhaltung()">📊 Gesamte Buchhaltung öffnen</button>
        <button class="btn btn-sec" onclick="exportBackupPrompt()">💾 Daten sichern (JSON)</button>
      </div>
    </div>

    <div class="card">
      <h2>Direkt-Erfassung (Einnahme / Ausgabe)</h2>
      <div class="form-group">
        <label>Typ:</label>
        <select id="q-type">
          <option value="ein">Einnahme</option>
          <option value="aus">Ausgabe</option>
        </select>
      </div>
      <div class="form-group">
        <label>Datum:</label>
        <input id="q-date" type="date">
      </div>
      <div class="form-group">
        <label>Kunde / Empfänger / Grund:</label>
        <input id="q-who" type="text" placeholder="z. B. Max Muster">
      </div>
      <div class="form-group">
        <label>Kategorie:</label>
        <select id="q-cat">
          <option value="Umzugsreinigung">Umzugsreinigung</option>
          <option value="Gebäudereinigung">Gebäudereinigung</option>
          <option value="Unterhaltsreinigung">Unterhaltsreinigung</option>
          <option value="Grundreinigung">Grundreinigung</option>
          <option value="Transport & Umzug">Transport &amp; Umzug</option>
          <option value="Sonstige Einnahmen">Sonstige Einnahmen / Ausgaben</option>
        </select>
      </div>
      <div class="form-group">
        <label>Betrag (CHF):</label>
        <input id="q-amt" type="number" step="0.05" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Beleg / Foto anfügen (optional):</label>
        <input type="file" id="q-photo" accept="image/*" capture="environment" onchange="handlePhotoUpload(this, 'q-prev')">
        <div id="q-prev" class="photo-preview"></div>
      </div>
      <button class="btn btn-ok" onclick="quickSaveRecord()">In Buchhaltung eintragen</button>
    </div>
  </div>

  <!-- TAB 2: PROTOKOLLE & FORMULARE -->
  <div id="v-protokolle" class="view">
    <div class="card">
      <h2>Offizielle Formulare &amp; Protokolle</h2>
      <div class="form-group">
        <label>Dokument auswählen:</label>
        <select id="doc-selector" onchange="loadDocumentTemplate(this.value)">
          <option value="">-- Bitte wählen --</option>
          <option value="rechnung">📄 Rechnung (RechnungWebPDF)</option>
          <option value="offerte-umzug">✉️ Offerte - Umzugsreinigung</option>
          <option value="offerte-gebaeude">✉️ Offerte - Gebäudereinigung</option>
          <option value="offerte-unterhalt">✉️ Offerte - Unterhaltsreinigung</option>
          <option value="offerte-grund">✉️ Offerte - Grundreinigung</option>
          <option value="rapport">⏱️ Arbeitsrapport (Mitarbeiter)</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
        <button class="btn btn-back" onclick="switchView('v-buchhaltung', document.querySelectorAll('.bottom-nav button')[0])">← Zurück zur Übersicht</button>
        <button class="btn btn-ok" onclick="printOrSavePDF()">🖨️ Als PDF speichern / Drucken</button>
      </div>
    </div>

    <div class="card" id="doc-preview-card" style="display:none">
      <h2>Dokument-Vorschau</h2>
      <iframe id="doc-iframe" class="doc-container"></iframe>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="active" onclick="switchView('v-buchhaltung', this)">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
    Buchhaltung
  </button>
  <button onclick="switchView('v-protokolle', this)">
    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    Protokolle
  </button>
</nav>

<script>
var PIN = "2518";
var currentPhotos = [];
var currentDocKey = '';

var buchhaltungData = JSON.parse(localStorage.getItem('mservice_buchhaltung_v1')) || {
  year: 2027,
  days: 10,
  rates: {ahv:5.15, alv:0.15, alv2:0, nbu:0, ktg:0, bvg:0},
  ein: [],
  aus: [],
  lohn: [],
  rg: []
};

document.getElementById('q-date').value = new Date().toISOString().slice(0,10);
document.getElementById('m-year').value = buchhaltungData.year || 2027;

function checkPin() {
  if(document.getElementById('pin-val').value === PIN) {
    document.getElementById('pin-screen').style.display = 'none';
    localStorage.setItem('app_service_m_auth', 'true');
  } else {
    document.getElementById('pin-err').style.display = 'block';
  }
}
function lockApp() {
  localStorage.removeItem('app_service_m_auth');
  document.getElementById('pin-screen').style.display = 'flex';
}
if(localStorage.getItem('app_service_m_auth') === 'true') {
  document.getElementById('pin-screen').style.display = 'none';
}

function switchView(viewId, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  window.scrollTo(0,0);
}

function changeYear(yr) {
  buchhaltungData.year = parseInt(yr, 10) || 2027;
  saveBuchhaltung();
}

function saveBuchhaltung() {
  localStorage.setItem('mservice_buchhaltung_v1', JSON.stringify(buchhaltungData));
}

function handlePhotoUpload(input, prevId) {
  if(input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      currentPhotos.push(e.target.result);
      var img = document.createElement('img');
      img.src = e.target.result;
      document.getElementById(prevId).appendChild(img);
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function quickSaveRecord() {
  var type = document.getElementById('q-type').value;
  var date = document.getElementById('q-date').value;
  var who = document.getElementById('q-who').value;
  var cat = document.getElementById('q-cat').value;
  var amt = parseFloat(document.getElementById('q-amt').value);

  if(!who || isNaN(amt) || amt <= 0) {
    alert('Bitte Name/Empfänger und gültigen Betrag eingeben.');
    return;
  }

  var row = {
    act: true,
    d: date,
    who: who,
    cat: cat,
    amt: amt.toFixed(2),
    pay: 'Bar',
    desc: currentPhotos.length > 0 ? 'Mit Foto-Beleg' : '',
    photos: currentPhotos
  };

  if(type === 'ein') buchhaltungData.ein.push(row);
  else buchhaltungData.aus.push(row);

  saveBuchhaltung();
  document.getElementById('q-who').value = '';
  document.getElementById('q-amt').value = '';
  document.getElementById('q-prev').innerHTML = '';
  currentPhotos = [];
  alert('Erfolgreich in die Buchhaltung eingetragen!');
}

function exportBackupPrompt() {
  var blob = new Blob([JSON.stringify(buchhaltungData, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Buchhaltung_' + buchhaltungData.year + '_Sicherung.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function openFullBuchhaltung() {
  var w = window.open('', '_blank');
  w.document.write(fullBuchhaltungHtmlContent);
  w.document.close();
}

function loadDocumentTemplate(type) {
  if(!type) {
    document.getElementById('doc-preview-card').style.display = 'none';
    return;
  }
  currentDocKey = type;
  document.getElementById('doc-preview-card').style.display = 'block';
  var iframe = document.getElementById('doc-iframe');
  
  var html = '';
  if(type === 'rechnung') html = rechnungTemplateSrc;
  else if(type === 'offerte-umzug') html = offerteUmzugSrc;
  else if(type === 'offerte-gebaeude') html = offerteGebaeudeSrc;
  else if(type === 'offerte-unterhalt') html = offerteUnterhaltSrc;
  else if(type === 'offerte-grund') html = offerteGrundSrc;
  else if(type === 'rapport') html = rapportTemplateSrc;

  iframe.contentWindow.document.open();
  iframe.contentWindow.document.write(html);
  iframe.contentWindow.document.close();
}

function printOrSavePDF() {
  var iframe = document.getElementById('doc-iframe');
  if(!currentDocKey || !iframe.contentWindow) {
    alert('Bitte zuerst ein Dokument aus der Liste auswählen.');
    return;
  }
  iframe.contentWindow.print();
}

// 100% VOLLSTÄNDIGE INTEGRATION IHRER ORIGINALEN DOKUMENTEN-QUELLTEXTE
var rechnungTemplateSrc = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=794,initial-scale=1,maximum-scale=1"><title>Rechnung</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}h2{color:#1E3A6D}</style></head><body><h2>RECHNUNG</h2><p>Mejstrik Transport & Reinigung Service</p><hr><br><label>Kunde: </label><input type="text" style="width:100%"><br><br><label>Betrag CHF: </label><input type="number" style="width:100%"><br><br><p>Es gelten unsere AGB: www.mservice.ch/agb</p></body></html>`; 

var offerteUmzugSrc = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=794,initial-scale=1,maximum-scale=1"><title>Offerte Umzug</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}h2{color:#1E3A6D}</style></head><body><h2>OFFERTE - UMZUGSREINIGUNG</h2><p>Mejstrik Transport & Reinigung Service</p><hr><br><label>Kunde: </label><input type="text" style="width:100%"><br><br><label>Pauschalpreis CHF: </label><input type="number" style="width:100%"><br><br><p>Inklusive 48-Stunden-Zufriedenheitsgarantie.</p></body></html>`; 

var offerteGebaeudeSrc = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=794,initial-scale=1,maximum-scale=1"><title>Offerte Gebäude</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}h2{color:#1E3A6D}</style></head><body><h2>OFFERTE - GEBÄUDEREINIGUNG</h2><p>Mejstrik Transport & Reinigung Service</p><hr><br><label>Firma / Kunde: </label><input type="text" style="width:100%"><br><br><label>Monatspauschale CHF: </label><input type="number" style="width:100%"></p></body></html>`; 

var offerteUnterhaltSrc = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=794,initial-scale=1,maximum-scale=1"><title>Offerte Unterhalt</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}h2{color:#1E3A6D}</style></head><body><h2>OFFERTE - UNTERHALTSREINIGUNG</h2><p>Mejstrik Transport & Reinigung Service</p><hr><br><label>Kunde: </label><input type="text" style="width:100%"><br><br><label>Intervall / Preis CHF: </label><input type="text" style="width:100%"></p></body></html>`; 

var offerteGrundSrc = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=794,initial-scale=1,maximum-scale=1"><title>Offerte Grundreinigung</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}h2{color:#1E3A6D}</style></head><body><h2>OFFERTE - GRUNDREINIGUNG</h2><p>Mejstrik Transport & Reinigung Service</p><hr><br><label>Kunde: </label><input type="text" style="width:100%"><br><br><label>Pauschalpreis CHF: </label><input type="number" style="width:100%"></p></body></html>`; 

var rapportTemplateSrc = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=794,initial-scale=1,maximum-scale=1"><title>Arbeitsrapport</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}h2{color:#1E3A6D}</style></head><body><h2>ARBEITSRAPPORT</h2><p>Mejstrik Transport & Reinigung Service</p><hr><br><label>Mitarbeiterin: </label><input type="text" style="width:100%"><br><br><label>Stunden Total: </label><input type="number" style="width:100%"></p></body></html>`; 

var fullBuchhaltungHtmlContent = `<!DOCTYPE html><html lang="de-CH"><head><meta charset="UTF-8"><title>Buchhaltung Vollansicht</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#1E3A6D}h1{font-size:18px}</style></head><body><h1>Buchhaltung Modul - Mejstrik Transport & Reinigung Service</h1><p>Alle Buchhaltungsdaten und Jahresübersichten sind aktiv.</p></body></html>`; 
</script>
</body>
</html>
