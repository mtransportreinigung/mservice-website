<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M-Service">
<title>M-Service App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
:root{
  --n:#1E3A6D;--b:#2D6CB5;--br:#1F4EA8;--o:#F57C00;--l:#F4F7FB;--bd:#D6DFEA;--g:#666;--ok:#1F7A44;--bad:#C0392B;
  --sat:env(safe-area-inset-top, 59px);
  --sab:env(safe-area-inset-bottom, 34px);
}
html,body{background:#000;font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#1c1c1e;height:100%;overflow:hidden}

/* PIN SCREEN */
#pin-screen{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 20px);color:#fff}
.pin-header{text-align:center;margin-top:20px}
.pin-logo{width:64px;height:58px;margin-bottom:12px}
.pin-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.pin-sub{font-size:13px;color:#94a3b8}
.pin-dots{display:flex;gap:16px;margin:30px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #475569;background:transparent;transition:all .2s ease}
.pin-dot.active{background:var(--o);border-color:var(--o);box-shadow:0 0 12px rgba(245,124,0,.5)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%;max-width:320px;margin-bottom:10px}
.pin-btn{height:72px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:26px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.pin-btn:active{background:rgba(245,124,0,.4);border-color:var(--o)}
.pin-err{color:#f87171;font-size:13px;min-height:20px;text-align:center;font-weight:500}

/* MAIN APP WRAPPER (iPhone 16 Pro Container) */
#app-container{display:none;height:100vh;background:#f2f2f7;display:none;flex-direction:column;padding-top:var(--sat)}

/* APP HEADER */
.app-header{background:#fff;border-bottom:1px solid #e5e5ea;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-none:none}
.app-brand{display:flex;align-items:center;gap:10px}
.app-logo{width:36px;height:32px}
.app-title b{display:block;font-size:14px;color:var(--n);line-height:1.1}
.app-title span{font-size:11px;color:var(--g)}
.app-actions{display:flex;gap:6px}
.btn-icon{border:0;background:#e5e5ea;color:var(--n);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600}

/* MAIN CONTENT AREA */
.app-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--sab) + 75px)}

/* NAV TABS (Bottom Bar for iPhone) */
.app-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,.2);display:flex;justify-content:space-around;padding:8px 6px var(--sab);z-index:1000}
.nav-btn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8e8e93;font-size:10px;font-weight:500;width:20%}
.nav-btn svg{width:22px;height:22px;fill:currentColor}
.nav-btn.on{color:var(--b);font-weight:600}

/* CARDS & UI COMPONENTS */
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-size:15px;font-weight:700;color:var(--n);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.hint{font-size:12px;color:var(--g);margin-bottom:10px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi-box{background:var(--l);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--bd)}
.kpi-box small{display:block;font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase}
.kpi-box b{font-size:17px;color:var(--n);display:block;margin-top:2px}

/* FORM ELEMENTS */
.f-group{margin-bottom:10px}
.f-group label{display:block;font-size:12px;font-weight:600;color:#3a3a3c;margin-bottom:4px}
.f-control{width:100%;height:38px;background:#f2f2f7;border:1px solid #d1d1d6;border-radius:8px;padding:0 10px;font-size:14px;color:#000;outline:0}
.f-control:focus{border-color:var(--b);background:#fff}
textarea.f-control{height:auto;padding:8px 10px}

/* MOBILNÍ LISTY DATA */
.m-list-item{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;position:relative}
.m-list-head{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:700;font-size:13px}
.m-list-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.btn-del{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--bad);font-size:18px;font-weight:bold;padding:0 4px}

/* SECTION VISIBILITY */
.sec{display:none}
.sec.on{display:block}

/* PRINT ENGINE (PŮVODNÍ A4 DOKUMENTY PRO TISK) */
#print-area{display:none}

@media print{
  html,body{background:#fff;height:auto;overflow:visible;padding:0}
  #pin-screen,#app-container{display:none!important}
  #print-area{display:block!important}
  @page{size:A4;margin:0}
  
  /* Styl ze souboru RechnungWebPDF.html */
  .page-print{width:210mm;height:297mm;position:relative;background:#fff;margin:0 auto;page-break-after:always;font-family:Arial,Helvetica,sans-serif;font-size:8.8pt;color:#2a2a2a}
  .page-print .logo{position:absolute;left:18mm;top:10mm;width:21mm;height:18.8mm}
  .page-print .hd-title{position:absolute;left:43mm;top:10.6mm;font:bold 12.5pt Arial;color:#1F4EA8}
  .page-print .hd-sub{position:absolute;left:43mm;top:17.2mm;font-size:9pt;line-height:1.45}
  .page-print .title{position:absolute;left:18mm;top:43mm;font:bold 20pt/1 Arial;color:#1E3A6D}
  .page-print .sub{position:absolute;left:18mm;top:53.2mm;font:bold 11.5pt/5mm Arial;color:#1F4EA8;border-left:1.3mm solid #F57C00;padding-left:2.1mm}
  .page-print .meta{position:absolute;left:18mm;top:63.4mm;width:82mm;font-size:8.6pt}
  .page-print .meta div{display:flex;justify-content:space-between;margin-bottom:2mm;border-bottom:.6pt solid #8FA3BF}
  .page-print .win{position:absolute;left:118mm;top:48.5mm;width:80mm;font-size:10.5pt;line-height:1.4}
  .page-print .win-hdr{font-size:6.2pt;color:#666;border-bottom:.3pt solid #666;padding-bottom:.6mm;margin-bottom:1.6mm}
  .page-print .body{position:absolute;left:18mm;right:15mm;top:94mm}
  .page-print table{width:100%;border-collapse:collapse}
  .page-print th{background:#2D6CB5;color:#fff;text-align:left;padding:4.5pt 6pt;font-size:8.8pt}
  .page-print td{padding:4.2pt 6pt;border-bottom:.5pt solid #D6DFEA;font-size:8.8pt}
  .page-print tr:nth-child(even) td{background:#F4F7FB}
  .page-print .r{text-align:right}
  .page-print .totals{display:grid;grid-template-columns:1fr 72mm;gap:6mm;margin-top:10pt}
  .page-print .tot-box{background:#EAF3FC;border:.9pt solid #8FC0EE;padding:6pt 8pt;display:flex;justify-content:space-between;font-weight:bold;font-size:11pt;color:#1E3A6D;margin-top:2mm}
  .page-print .foot{position:absolute;left:18mm;right:15mm;bottom:10mm;height:12mm;font-size:7.5pt;border-top:.6pt solid #D6DFEA;text-align:center;color:#444;padding-top:2mm}
}
</style>
</head>

<!-- 3. TISKOVÝ ENGIN (Generuje originální dokumenty A4 při tisku) -->
<div id="print-area"></div>

<script>
/* PIN ENGINE */
var enteredPin = '';
function pressPin(v){
  if(v==='C'){ enteredPin=''; updatePinDots(); return; }
  if(v==='OK'){
    if(enteredPin==='2518'){
      document.getElementById('pin-screen').style.display='none';
      document.getElementById('app-container').style.display='flex';
    } else {
      document.getElementById('pin-err').textContent='Falscher PIN!';
      enteredPin=''; updatePinDots();
    }
    return;
  }
  if(enteredPin.length < 4){
    enteredPin += v;
    updatePinDots();
    if(enteredPin.length === 4){
      setTimeout(function(){ pressPin('OK'); }, 150);
    }
  }
}
function updatePinDots(){
  for(var i=0;i<4;i++){
    var d = document.getElementById('d'+i);
    if(i < enteredPin.length) d.classList.add('active');
    else d.classList.remove('active');
  }
}

/* NAVIGATION */
function switchTab(secId, btn){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('on')});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('on')});
  document.getElementById(secId).classList.add('on');
  btn.classList.add('on');
}

/* DATA STORAGE */
var K='mservice_iphone_v1', S={ein:[], aus:[]};
function loadData(){
  try{ var d=localStorage.getItem(K); if(d) S=JSON.parse(d); }catch(e){}
  if(!S.ein.length) S.ein=[{d:'2026-10-15',who:'Kunde Meier',amt:450,cat:'Umzugsreinigung'}];
  if(!S.aus.length) S.aus=[{d:'2026-10-12',who:'Tankanlage',amt:85,cat:'Benzin & Transport'}];
  renderAll();
}
function saveData(){ try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){} renderAll(); }

function renderAll(){
  var te=0, ta=0;
  var einHtml = '';
  S.ein.forEach(function(r, i){
    te += parseFloat(r.amt||0);
    einHtml += `<div class="m-list-item">
      <button class="btn-del" onclick="delEin(${i})">×</button>
      <div class="m-list-head"><span>${r.who||'Kunde'}</span><span style="color:var(--ok)">CHF ${(parseFloat(r.amt)||0).toFixed(2)}</span></div>
      <div class="m-list-row"><div>${r.d||''}</div><div>${r.cat||''}</div></div>
    </div>`;
  });
  document.getElementById('ein-list').innerHTML = einHtml;

  var ausHtml = '';
  S.aus.forEach(function(r, i){
    ta += parseFloat(r.amt||0);
    ausHtml += `<div class="m-list-item">
      <button class="btn-del" onclick="delAus(${i})">×</button>
      <div class="m-list-head"><span>${r.who||'Ausgabe'}</span><span style="color:var(--bad)">CHF ${(parseFloat(r.amt)||0).toFixed(2)}</span></div>
      <div class="m-list-row"><div>${r.d||''}</div><div>${r.cat||''}</div></div>
    </div>`;
  });
  document.getElementById('aus-list').innerHTML = ausHtml;

  document.getElementById('k-e').textContent = te.toFixed(2);
  document.getElementById('k-a').textContent = ta.toFixed(2);
  document.getElementById('k-g').textContent = (te - ta).toFixed(2);
}

function addEinRow(){
  var w = prompt("Kunde / Beschreibung:");
  var a = prompt("Betrag CHF:");
